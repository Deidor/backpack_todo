services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: backpack
      POSTGRES_PASSWORD: backpack
      POSTGRES_DB: backpack
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backpack -d backpack"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data: