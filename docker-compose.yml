services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: backpack
      POSTGRES_PASSWORD: backpack
      POSTGRES_DB: backpack
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backpack -d backpack"]
      interval: 5s
      timeout: 3s
      retries: 10

 # Optional: run the API in a container too.
  #   docker compose --profile api up -d --build
  api:
    profiles: [api]
    build: ./api
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://backpack:backpack@db:5432/backpack
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: